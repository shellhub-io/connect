name: Build
on:
  push:
    branches: [ master ]
    tags:
      - v*
  pull_request:
    branches: [ master ]

# Builds the Wails v3 desktop app for each platform on its native runner.
# Linux produces AppImage + .deb + .rpm; Windows an NSIS installer; macOS an .app bundle.
#
# NOTE: the toolchain targets GTK4 / WebKitGTK 6.0 (matches build/linux/nfpm/nfpm.yaml deps).
# That requires a recent runner (ubuntu-24.04+). If AppImage generation fails on the
# linuxdeploy GTK plugin (e.g. missing obsolete libcroco), see the GTK3 alternative noted
# in docs / the migration notes.

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      # linuxdeploy/appimagetool need FUSE; extract-and-run avoids requiring it on CI.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Ensure libcroco is present for AppImage bundling
        # The linuxdeploy GTK plugin still references the obsolete libcroco; it must exist on the
        # BUILD HOST so it gets bundled INTO the AppImage (the result stays self-contained). Install
        # from apt, falling back to the archived .deb if the runner's repos no longer ship it.
        run: |
          sudo apt-get install -y libcroco3 || \
          ( curl -fsSL -o /tmp/libcroco3.deb \
              http://archive.ubuntu.com/ubuntu/pool/main/libc/libcroco/libcroco3_0.6.13-1ubuntu0.1_amd64.deb \
            && sudo dpkg -i /tmp/libcroco3.deb )

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # .deb / .rpm use nfpm (pure Go) and are reliable — build them first.
      - name: Build .deb and .rpm
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm

      # AppImage uses linuxdeploy; isolate it so a failure doesn't drop the deb/rpm artifacts.
      - name: Build AppImage
        continue-on-error: true
        run: wails3 task linux:create:appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Package (NSIS installer)
        run: wails3 task package
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bin/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Package (.app bundle)
        run: wails3 task package
      - name: Zip .app for upload
        run: ditto -c -k --keepParent "bin/ShellHub.app" "bin/ShellHub-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: bin/*.zip

  publish:
    if: "contains(github.ref, 'refs/tags/v')"
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
